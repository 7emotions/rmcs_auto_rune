%YAML:1.0
---
# 神符中心 EKF 参数
#
# 抖动调参指南:
#   抖动变大: 增大 MEASUREMENT_NOISE, 或减小 PROCESS_NOISE_POS / PROCESS_NOISE_VEL
#   响应变慢: 减小 MEASUREMENT_NOISE, 或增大 PROCESS_NOISE_POS
#
# 核心原则: 神符中心在物理上近乎静止，应高度信任模型而非嘈杂的测量值。
#   MEASUREMENT_NOISE / PROCESS_NOISE_POS 比值越大，输出越平滑。
PROCESS_NOISE_POS: 1.0000000000000000e-02
PROCESS_NOISE_VEL: 1.0000000000000000e-01
MEASUREMENT_NOISE: 5.0000000000000000e+01
