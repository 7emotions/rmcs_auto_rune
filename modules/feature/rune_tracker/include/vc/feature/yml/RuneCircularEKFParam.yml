%YAML:1.0
---
# 神符靶心圆周运动 EKF 参数
#
# 两种模式共用:
#   Q_THETA   - 角度过程噪声（越小角度估计越平滑）
#   R_THETA   - 角度测量噪声（atan2 测量值的方差，rad²；越大越依赖模型）
#
# CONSTANT 模式（恒角速度）:
#   Q_OMEGA   - 角速度过程噪声（越小 ω 变化越慢）
#   INIT_OMEGA - 初始角速度猜测值（rad/s）
#
# SINUSOIDAL 模式（正弦角速度，ω(t) = A·sin(2π/T·t + phase) + B）:
#   SINUSOIDAL_PERIOD - 正弦周期 T（秒），RoboMaster 大符标准值 ≈ 3.33 s
#   Q_A     - 振幅 A 的过程噪声
#   Q_PHASE - 相位过程噪声（通常极小，相位由运动方程确定性推进）
#   Q_B     - 直流偏置 B 的过程噪声
#   INIT_A  - 振幅初始猜测值（rad/s）
#   INIT_B  - 直流偏置初始猜测值（rad/s）
Q_THETA: 1.0000000000000001e-04
R_THETA: 1.0000000000000000e-02
Q_OMEGA: 1.0000000000000000e-03
INIT_OMEGA: 1.5000000000000000e+00
SINUSOIDAL_PERIOD: 3.3299999237060547e+00
Q_A: 1.0000000000000000e-03
Q_PHASE: 9.9999999747524271e-07
Q_B: 1.0000000000000000e-03
INIT_A: 7.8500002622604370e-01
INIT_B: 1.3050000667572021e+00
